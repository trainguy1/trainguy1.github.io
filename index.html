<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>David's Modern Trains</title>

<style>
body {
  font-family: Arial, sans-serif;
  margin: 0;
  background: #f0f4f8;
}

/* OVERLAY (blur background) */
.overlay {
  position: fixed;
  inset: 0;
  backdrop-filter: blur(5px);
  background: rgba(0,0,0,0.3);
  opacity: 0;
  pointer-events: none;
  transition: 0.3s;
  z-index: 5;
}

/* SHOW OVERLAY WHEN HOVERING GALLERY */
.gallery:hover ~ .overlay {
  opacity: 1;
}

/* HEADER */
header {
  background: #007bff;
  color: white;
  text-align: center;
  padding: 2em;
}

/* MAIN */
main {
  max-width: 1000px;
  margin: auto;
  padding: 1.5em;
}

.section {
  background: white;
  padding: 1.5em;
  margin-bottom: 2em;
  border-radius: 10px;
}

h2 {
  color: #ff4500;
}

/* GALLERY */
.gallery {
  display: flex;
  flex-wrap: wrap;
  gap: 1em;
}

.gallery img {
  width: calc(33.333% - 1em);
  height: 180px;
  object-fit: cover;
  border-radius: 8px;
  cursor: pointer;

  transition: all 0.3s ease;
  position: relative;
  z-index: 1;
}

/* HOVER EFFECT */
.gallery img:hover {
  transform: scale(1.5);
  z-index: 10;
  outline: 4px solid #007bff;
  box-shadow: 0 20px 40px rgba(0,0,0,0.4);
}

/* CONTACT */
.contact-form input,
.contact-form textarea {
  width: 100%;
  padding: 0.6em;
  margin-bottom: 1em;
}

button {
  padding: 0.7em 1.2em;
  background: #007bff;
  color: white;
  border: none;
  cursor: pointer;
}

footer {
  text-align: center;
  padding: 1em;
  background: #222;
  color: white;
}
</style>
</head>

<body>

<header>
  <h1>David's Modern Trains</h1>
</header>

<main>

<section class="section">
  <h2>About Me</h2>
  <p>Hello, my name is David and I have a passion for modern trains. I enjoy exploring the latest advancements in train technology and sharing my enthusiasm with others!</p>
</section>

<section class="section">
  <h2>Gallery</h2>

  <div class="gallery">
    <img src="https://images.unsplash.com/photo-1683425806298-178e0fdfc287?q=80&w=1374&auto=format&fit=crop">
    <img src="https://images.unsplash.com/photo-1585585819719-fe03f0c77f35?q=80&w=800&auto=format&fit=crop">
    <img src="https://images.unsplash.com/photo-1474487548417-781cb71495f3?auto=format&fit=crop&w=800&q=80">
    <img src="https://images.unsplash.com/photo-1514996937319-344454492b37?auto=format&fit=crop&w=800&q=80">
    <img src="https://images.unsplash.com/photo-1555217851-6141535bd771?auto=format&fit=crop&w=800&q=80">
    <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=800&q=80">
  </div>

</section>

<section class="section">
  <h2>Contact</h2>

  <form class="contact-form" action="https://formspree.io/f/xqkroqjk" method="POST">
    <input type="text" name="name" placeholder="Name" required>
    <input type="email" name="email" placeholder="Email" required>
    <textarea name="message" rows="4" placeholder="Message" required></textarea>
    <button type="submit">Send</button>
  </form>
</section>

</main>

<div class="overlay"></div>

<footer>
  <p>© 2026 David</p>
</footer>

</body>
</html>
