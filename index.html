<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>David's Modern Trains</title>

<link rel="icon" type="image/x-icon" href="/favicon.ico?v=11">
<link rel="shortcut icon" type="image/x-icon" href="/favicon.ico?v=11">
  
<style>
body {
  font-family: Arial, sans-serif;
  margin: 0;
  background: #f0f4f8;
  color: #000;
  transition: 0.3s;
}

/* DARK MODE */
.dark-mode {
  background: #111;
  color: #eee;
}

.dark-mode .section {
  background: #1e1e1e;
}

.dark-mode header {
  background: #003b7a;
}

.dark-mode footer {
  background: #000;
}

.dark-mode h2 {
  color: #66aaff;
}

.dark-mode .contact-form input,
.dark-mode .contact-form textarea {
  background: #2a2a2a;
  color: #eee;
  border: 1px solid #555;
}

/* SIDEBAR */
.sidebar {
  position: fixed;
  top: 0;
  left: -290px;
  width: 240px;
  height: 100%;
  background: #111827;
  color: white;
  padding: 1.5em;
  box-shadow: 5px 0 20px rgba(0,0,0,0.3);
  transition: left 0.3s ease;
  z-index: 30;
}

.sidebar.open {
  left: 0;
}

.sidebar a {
  display: block;
  color: white;
  text-decoration: none;
  margin: 1em 0;
  padding: 0.7em;
  border-radius: 6px;
}

.sidebar a:hover {
  background: #007bff;
}

/* MENU BUTTON */
.menu-btn {
  position: fixed;
  top: 18px;
  left: 18px;
  z-index: 25;
  width: 44px;
  height: 44px;
  border-radius: 12px;
  background: rgba(255,255,255,0.2);
  backdrop-filter: blur(6px);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  border: none;
  transition: 0.25s;
  padding: 0;
}

.menu-btn:hover {
  transform: scale(1.1);
  background: rgba(255,255,255,0.35);
}

.bar {
  display: block;
  width: 22px;
  height: 2px;
  background: white;
  margin: 3px 0;
  transition: 0.3s;
}

.menu-btn.open .bar:nth-child(1) {
  transform: translateY(8px) rotate(45deg);
}

.menu-btn.open .bar:nth-child(2) {
  opacity: 0;
}

.menu-btn.open .bar:nth-child(3) {
  transform: translateY(-8px) rotate(-45deg);
}

/* HEADER */
header {
  background: #007bff;
  color: white;
  text-align: center;
  padding: 2em;
  position: relative;
}

/* DARK MODE SLIDER */
.switch {
  position: absolute;
  top: 15px;
  right: 15px;
  width: 62px;
  height: 34px;
}

.switch input {
  opacity: 0;
}

.slider {
  position: absolute;
  inset: 0;
  background: #ccc;
  border-radius: 999px;
  cursor: pointer;
  transition: 0.4s;
}

.slider::before {
  content: "☀️";
  position: absolute;
  height: 26px;
  width: 26px;
  left: 4px;
  bottom: 4px;
  background: white;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: 0.4s;
}

.switch input:checked + .slider {
  background: #111827;
}

.switch input:checked + .slider::before {
  transform: translateX(28px) rotate(360deg);
  content: "🌙";
}

/* MAIN */
main {
  max-width: 1000px;
  margin: auto;
  padding: 1.5em;
}

.section {
  background: white;
  padding: 1.5em;
  margin-bottom: 2em;
  border-radius: 10px;
}

h2 {
  color: #ff4500;
}

/* GALLERY */
.gallery {
  display: flex;
  flex-wrap: wrap;
  gap: 1em;
}

.gallery img {
  width: calc(33.333% - 1em);
  height: 180px;
  object-fit: cover;
  border-radius: 8px;
  cursor: pointer;
  transition: all 0.3s ease;
  z-index: 1;
}

.gallery img:hover {
  transform: scale(1.5);
  z-index: 10;
  outline: 4px solid #007bff;
  box-shadow: 0 20px 40px rgba(0,0,0,0.4);
}

/* CONTACT */
.contact-form input,
.contact-form textarea {
  width: 100%;
  padding: 0.6em;
  margin-bottom: 1em;
  border: 1px solid #ccc;
}

/* FOOTER */
footer {
  text-align: center;
  padding: 1em;
  background: #222;
  color: white;
}

.sidebar a.active {
  background: #007bff;
  font-weight: bold;
  box-shadow: 0 0 12px rgba(0,123,255,0.6);
}

.sidebar a:active {
  transform: translateX(6px) scale(0.98);
}

.sidebar {
  transition: left 0.3s ease;
}

#overlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.4);
  backdrop-filter: blur(4px);
  opacity: 0;
  pointer-events: none;
  transition: 0.3s;
  z-index: 5;
}

#overlay.active {
  opacity: 1;
  pointer-events: all;
}

.close-btn {
  position: absolute;
  top: 15px;
  right: 15px;
  width: 40px;
  height: 40px;
  border-radius: 10px;
  background: rgba(255,255,255,0.1);
  backdrop-filter: blur(6px);
  border: none;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: 0.25s;
}

.close-btn:hover {
  background: rgba(255,255,255,0.25);
  transform: scale(1.1);
}

/* The X lines */
.close-btn span {
  position: absolute;
  width: 20px;
  height: 2px;
  background: white;
  border-radius: 2px;
}

/* Rotate into X */
.close-btn span:nth-child(1) {
  transform: rotate(45deg);
}

.close-btn span:nth-child(2) {
  transform: rotate(-45deg);
}

.close-btn {
  box-shadow: 0 4px 15px rgba(0,0,0,0.2);
}

.sidebar a {
  transition: 0.25s;
}

.sidebar a:hover {
  transform: translateX(5px);
}

.sidebar a.active {
  transform: translateX(8px);
}
</style>
</head>

<body>

<div id="overlay"></div>

<nav id="sidebar" class="sidebar">
  <button id="closeSidebar" class="close-btn">
  <span></span>
  <span></span>
</button>
  <h2>Pages</h2>
  <a href="index.html" class="active">Home</a>
  <a href="links.html">Links</a>
</nav>

  
<button id="openSidebar" class="menu-btn">
  <span class="bar"></span>
  <span class="bar"></span>
  <span class="bar"></span>
</button>

<header>
  <h1>David's Modern Trains</h1>

  <label class="switch">
    <input type="checkbox" id="darkModeToggle">
    <span class="slider"></span>
  </label>
</header>

<main>

<section class="section">
  <h2>About Me</h2>
  <p>Hello, my name is David and I have a passion for modern trains. I enjoy exploring the latest advancements in train technology and sharing my enthusiasm with others!</p>
</section>

<section class="section">
  <h2>Gallery</h2>
  <div class="gallery">
    <img src="https://images.unsplash.com/photo-1683425806298-178e0fdfc287?q=80&w=1374&auto=format&fit=crop" alt="Modern train">
    <img src="https://images.unsplash.com/photo-1585585819719-fe03f0c77f35?q=80&w=800&auto=format&fit=crop" alt="Train station">
    <img src="https://images.unsplash.com/photo-1680993136369-84072bb4882e?q=80&w=1740&auto=format&fit=crop" alt="Train view">
    <img src="https://images.unsplash.com/photo-1762417421978-d95cc60ad968?q=80&w=687&auto=format&fit=crop" alt="Railway">
    <img src="https://images.unsplash.com/photo-1555217851-6141535bd771?auto=format&fit=crop&w=800&q=80" alt="Tracks">
    <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=800&q=80" alt="Landscape">
  </div>
</section>

<section class="section">
  <h2>Contact</h2>
  <form class="contact-form" action="https://formspree.io/f/xqkroqjk" method="POST">
    <input type="text" name="name" placeholder="Name" required>
    <input type="email" name="email" placeholder="Email" required>
    <textarea name="message" rows="4" placeholder="Message" required></textarea>
    <button type="submit">Send</button>
  </form>
</section>

</main>

<footer>
  <p>© 2026 David</p>
</footer>

<script>
const toggle = document.getElementById("darkModeToggle");

if (localStorage.getItem("darkMode") === "on") {
  document.body.classList.add("dark-mode");
  toggle.checked = true;
}

toggle.addEventListener("change", () => {
  document.body.classList.toggle("dark-mode");
  localStorage.setItem("darkMode",
    document.body.classList.contains("dark-mode") ? "on" : "off"
  );
});

const sidebar = document.getElementById("sidebar");
const menuBtn = document.getElementById("openSidebar");

menuBtn.onclick = () => {
  sidebar.classList.toggle("open");
  menuBtn.classList.toggle("open");
};

document.getElementById("closeSidebar").onclick = () => {
  sidebar.classList.remove("open");
  menuBtn.classList.remove("open");
};

menuBtn.onclick = () => {
  sidebar.classList.toggle("open");
  menuBtn.classList.toggle("open");
  overlay.classList.toggle("active");
};

closeSidebar.onclick = () => {
  sidebar.classList.remove("open");
  menuBtn.classList.remove("open");
  overlay.classList.remove("active");
};

overlay.onclick = () => {
  sidebar.classList.remove("open");
  menuBtn.classList.remove("open");
  overlay.classList.remove("active");
};
</script>

</body>
</html>
