<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>David's Links</title>

<style>
/* BASE (LIGHT MODE) */
body {
  font-family: Arial, sans-serif;
  margin: 0;
  background: #f0f4f8;
  color: #000;
  transition: 0.3s;
}

/* HEADER (LIGHT MODE = BLUE) */
header {
  background: #007bff;
  color: white;
  text-align: center;
  padding: 2em;
  position: relative;
}

/* CARDS (LIGHT MODE = WHITE + BLUE) */
.card {
  background: white;
  color: #000;
  padding: 2em;
  border-radius: 16px;
  margin-bottom: 2em;
  text-align: center;
  box-shadow: 0 15px 35px rgba(0,0,0,0.08);
}

.link-card {
  background: white;
  color: inherit;
  text-decoration: none;
  padding: 1.2em;
  border-radius: 14px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-left: 6px solid #007bff;
  box-shadow: 0 10px 25px rgba(0,0,0,0.08);
}

/* DARK MODE (DOT MATRIX THEME) */
.dark-mode {
  background: #050505;
  color: #f5f5f5;
}

.dark-mode header {
  background: #050505;
  color: #ffcc00;
  border-bottom: 3px solid #222;
  box-shadow: 0 0 25px rgba(255,204,0,0.15);
}

.dark-mode h2 {
  color: #ffcc00;
  font-family: "Courier New", monospace;
  letter-spacing: 2px;
  text-transform: uppercase;
}

.dark-mode .card,
.dark-mode .link-card {
  background: #101010;
  color: #f5f5f5;
  border: 1px solid #333;
  box-shadow: inset 0 0 18px rgba(255,204,0,0.08);
}

.dark-mode .link-card {
  border-left: 6px solid #ffcc00;
}

/* SIDEBAR (always dot-matrix) */
.sidebar {
  position: fixed;
  top: 0;
  left: -290px;
  width: 240px;
  height: 100%;
  background: #050505;
  color: #ffcc00;
  padding: 1.5em;
  box-shadow: 5px 0 20px rgba(0,0,0,0.5);
  transition: left 0.3s ease;
  z-index: 30;
  border-right: 3px solid #222;
}

.sidebar.open {
  left: 0;
}

.sidebar h2 {
  color: #ffcc00;
  font-family: "Courier New", monospace;
  letter-spacing: 3px;
  text-transform: uppercase;
  background: #111;
  padding: 0.6em;
  border-radius: 6px;
  border: 1px solid #333;
  margin-top: 60px;
}

.sidebar a {
  display: block;
  font-family: "Courier New", monospace;
  color: #ffcc00;
  text-decoration: none;
  margin: 1em 0;
  padding: 0.7em;
  border-radius: 6px;
  background: #0b0b0b;
  border: 1px solid #333;
  letter-spacing: 2px;
  text-transform: uppercase;
  opacity: 0;
  transform: translateX(-10px);
  transition: all 0.3s ease;
}

.sidebar.open a {
  opacity: 1;
  transform: translateX(0);
}

.sidebar.open a:hover {
  background: #1a1a00;
  transform: translateX(5px);
}

.sidebar.open a.active {
  background: #ffcc00;
  color: #111;
}

/* TRAIN TRANSITION */
#pageTrainTransition {
  position: fixed;
  top: 50%;
  left: -210%;
  transform: translateY(-50%);
  height: 120px;
  z-index: 9999;
  pointer-events: none;
  transition: left 1s linear;
}

#pageTrainTransition.active {
  left: 100%;
}

/* OVERLAY */
#overlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.4);
  backdrop-filter: blur(4px);
  opacity: 0;
  pointer-events: none;
  transition: 0.3s ease;
  z-index: 20;
}

#overlay.active {
  opacity: 1;
  pointer-events: all;
}

/* FOOTER */
footer {
  text-align: center;
  padding: 1em;
  background: #222;
  color: white;
}

/* MOBILE */
@media (max-width: 700px) {
  header {
    padding-top: 4em;
  }

  .link-card {
    flex-direction: column;
    align-items: flex-start;
    gap: 0.5em;
  }
}
</style>
</head>

<body>

<img id="pageTrainTransition" src="train.PNG" alt="Train">
  
<div id="overlay"></div>

<nav id="sidebar" class="sidebar">
  <button id="closeSidebar" class="close-btn">
    <span></span>
    <span></span>
  </button>

  <h2>Pages</h2>
  <a href="index.html" class="page-link">Home</a>
<a href="links.html" class="active">Links</a>
</nav>

<button id="openSidebar" class="menu-btn">
  <span class="bar"></span>
  <span class="bar"></span>
  <span class="bar"></span>
</button>

<header>
  <h1>David's Links</h1>

  <label class="switch">
    <input type="checkbox" id="darkModeToggle">
    <span class="slider"></span>
  </label>
</header>

<main>

<section class="card">
  <div class="profile-circle">🚆</div>
  <h2>My Accounts</h2>
  <p>Here are my main links and profiles.</p>
</section>

<section class="links">

  <a class="link-card" href="https://github.com/trainguy1" target="_blank">
    <div>
      <div class="link-title">GitHub</div>
      <div class="link-subtitle">My code and projects</div>
    </div>
    <div class="arrow">→</div>
  </a>

  <a class="link-card" href="https://www.youtube.com/@CrackedPolishedBlackstone" target="_blank">
    <div>
      <div class="link-title">YouTube</div>
      <div class="link-subtitle">Videos and train content</div>
    </div>
    <div class="arrow">→</div>
  </a>

  <a class="link-card" href="https://sketchfab.com/betasaur" target="_blank">
    <div>
      <div class="link-title">Sketchfab</div>
      <div class="link-subtitle">Train and Tech 3D prints</div>
    </div>
    <div class="arrow">→</div>
  </a>

</section>

</main>

<footer>
  <p>© 2026 David</p>
</footer>

<script>
const toggle = document.getElementById("darkModeToggle");
const sidebar = document.getElementById("sidebar");
const menuBtn = document.getElementById("openSidebar");
const overlay = document.getElementById("overlay");
const closeSidebar = document.getElementById("closeSidebar");

if (localStorage.getItem("darkMode") === "on") {
  document.body.classList.add("dark-mode");
  toggle.checked = true;
}

toggle.addEventListener("change", () => {
  document.body.classList.toggle("dark-mode");

  localStorage.setItem(
    "darkMode",
    document.body.classList.contains("dark-mode") ? "on" : "off"
  );
});

menuBtn.onclick = () => {
  sidebar.classList.toggle("open");
  menuBtn.classList.toggle("open");
  overlay.classList.toggle("active");
};

closeSidebar.onclick = () => {
  sidebar.classList.remove("open");
  menuBtn.classList.remove("open");
  overlay.classList.remove("active");
};

overlay.onclick = () => {
  sidebar.classList.remove("open");
  menuBtn.classList.remove("open");
  overlay.classList.remove("active");
};

const trainTransition = document.getElementById("pageTrainTransition");
const pageLinks = document.querySelectorAll(".page-link");

pageLinks.forEach(link => {
  link.addEventListener("click", function(event) {
    event.preventDefault();

    const targetPage = this.href;

    trainTransition.classList.add("active");

    setTimeout(() => {
      window.location.href = targetPage;
    }, 1000);
  });
});
</script>

</body>
</html>
