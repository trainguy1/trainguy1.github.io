<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>David's Modern Trains</title>

<style>
body {
  font-family: Arial, sans-serif;
  margin: 0;
  background: #f0f4f8;
  color: #000;
  transition: background 0.3s, color 0.3s;
}

/* DARK MODE */
.dark-mode {
  background: #111;
  color: #eee;
}

.dark-mode .section {
  background: #1e1e1e;
}

.dark-mode header {
  background: #003b7a;
}

.dark-mode footer {
  background: #000;
}

.dark-mode h2 {
  color: #66aaff;
}

.dark-mode .contact-form input,
.dark-mode .contact-form textarea {
  background: #2a2a2a;
  color: #eee;
  border: 1px solid #555;
}

.dark-mode .contact-form input::placeholder,
.dark-mode .contact-form textarea::placeholder {
  color: #aaa;
}

/* OVERLAY */
.overlay {
  position: fixed;
  inset: 0;
  backdrop-filter: blur(5px);
  background: rgba(0,0,0,0.3);
  opacity: 0;
  pointer-events: none;
  transition: 0.3s;
  z-index: 5;
}

.gallery:hover ~ .overlay {
  opacity: 1;
}

/* HEADER */
header {
  background: #007bff;
  color: white;
  text-align: center;
  padding: 2em;
  position: relative;
}

/* SLIDER */
.switch {
  position: absolute;
  top: 15px;
  right: 15px;
  width: 62px;
  height: 34px;
}

.switch input {
  opacity: 0;
  width: 0;
  height: 0;
}

.slider {
  position: absolute;
  inset: 0;
  cursor: pointer;
  background: #cfd8e3;
  border-radius: 999px;
  transition: 0.4s;
}

.slider::before {
  content: "☀️";
  position: absolute;
  height: 26px;
  width: 26px;
  left: 4px;
  bottom: 4px;
  background: white;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 13px;
  transition: 0.4s;
}

.switch input:checked + .slider {
  background: #111827;
}

.switch input:checked + .slider::before {
  transform: translateX(28px) rotate(360deg);
  content: "🌙";
}

/* MAIN */
main {
  max-width: 1000px;
  margin: auto;
  padding: 1.5em;
}

.section {
  background: white;
  padding: 1.5em;
  margin-bottom: 2em;
  border-radius: 10px;
  transition: background 0.3s;
}

h2 {
  color: #ff4500;
}

/* GALLERY */
.gallery {
  display: flex;
  flex-wrap: wrap;
  gap: 1em;
}

.gallery img {
  width: calc(33.333% - 1em);
  height: 180px;
  object-fit: cover;
  border-radius: 8px;
  cursor: pointer;
  transition: all 0.3s ease;
  position: relative;
  z-index: 1;
}

.gallery img:hover {
  transform: scale(1.5);
  z-index: 10;
  outline: 4px solid #007bff;
  box-shadow: 0 20px 40px rgba(0,0,0,0.4);
}

/* CONTACT */
.contact-form input,
.contact-form textarea {
  width: 100%;
  padding: 0.6em;
  margin-bottom: 1em;
  box-sizing: border-box;
  border: 1px solid #ccc;
  transition: background 0.3s, color 0.3s, border 0.3s;
}

button {
  padding: 0.7em 1.2em;
  background: #007bff;
  color: white;
  border: none;
  cursor: pointer;
}

/* FOOTER */
footer {
  text-align: center;
  padding: 1em;
  background: #222;
  color: white;
}
</style>
</head>

<body>

<header>
  <h1>David's Modern Trains</h1>

  <label class="switch">
    <input type="checkbox" id="darkModeToggle">
    <span class="slider"></span>
  </label>
</header>

<main>

<section class="section">
  <h2>About Me</h2>
  <p>Hello, my name is David and I have a passion for modern trains. I enjoy exploring the latest advancements in train technology and sharing my enthusiasm with others!</p>
</section>

<section class="section">
  <h2>Gallery</h2>

  <div class="gallery">
    <img src="https://images.unsplash.com/photo-1683425806298-178e0fdfc287?q=80&w=1374&auto=format&fit=crop">
    <img src="https://images.unsplash.com/photo-1585585819719-fe03f0c77f35?q=80&w=800&auto=format&fit=crop">
    <img src="https://images.unsplash.com/photo-1680993136369-84072bb4882e?q=80&w=1740&auto=format&fit=crop">
    <img src="https://images.unsplash.com/photo-1762417421978-d95cc60ad968?q=80&w=687&auto=format&fit=crop">
    <img src="https://images.unsplash.com/photo-1555217851-6141535bd771?auto=format&fit=crop&w=800&q=80">
    <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=800&q=80">
  </div>

</section>

<section class="section">
  <h2>Contact</h2>

  <form class="contact-form" action="https://formspree.io/f/xqkroqjk" method="POST">
    <input type="text" name="name" placeholder="Name" required>
    <input type="email" name="email" placeholder="Email" required>
    <textarea name="message" rows="4" placeholder="Message" required></textarea>
    <button type="submit">Send</button>
  </form>
</section>

</main>

<div class="overlay"></div>

<footer>
  <p>© 2026 David</p>
</footer>

<script>
const toggle = document.getElementById("darkModeToggle");

toggle.addEventListener("change", () => {
  document.body.classList.toggle("dark-mode");
});
</script>

</body>
</html>
