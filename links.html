<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>David's Links</title>

<style>
body {
  font-family: Arial, sans-serif;
  margin: 0;
  background: #f0f4f8;
  color: #000;
  transition: 0.3s;
}

.dark-mode {
  background: #111;
  color: #eee;
}

.dark-mode .card,
.dark-mode .link-card {
  background: #1e1e1e;
}

.dark-mode header {
  background: #003b7a;
}

.dark-mode footer {
  background: #000;
}

.dark-mode h2 {
  color: #66aaff;
}

/* OVERLAY */
#overlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.4);
  backdrop-filter: blur(4px);
  opacity: 0;
  pointer-events: none;
  transition: 0.3s ease;
  z-index: 20;
}

#overlay.active {
  opacity: 1;
  pointer-events: all;
}

#pageTrainTransition {
  position: fixed;
  top: 50%;
  left: -210%;
  transform: translateY(-50%);
  height: 120px;
  width: auto;
  z-index: 9999;
  pointer-events: none;
  transition: left 1s linear;
}

#pageTrainTransition.active {
  left: 100%;
}  

/* SIDEBAR */
.sidebar {
  position: fixed;
  top: 0;
  left: -290px;
  width: 240px;
  height: 100%;
  background: #050505;
  color: #ffcc00;
  padding: 1.5em;
  box-shadow: 5px 0 20px rgba(0,0,0,0.5);
  transition: left 0.3s ease;
  z-index: 30;
  border-right: 3px solid #222;
}

.sidebar.open {
  left: 0;
}

.sidebar h2 {
  color: #ffcc00;
  font-family: "Courier New", monospace;
  letter-spacing: 3px;
  text-transform: uppercase;
  background: #111;
  padding: 0.6em;
  border-radius: 6px;
  border: 1px solid #333;
  margin-top: 60px;
}

.sidebar a {
  display: block;
  font-family: "Courier New", monospace;
  color: #ffcc00;
  text-decoration: none;
  margin: 1em 0;
  padding: 0.7em;
  border-radius: 6px;
  background: #0b0b0b;
  border: 1px solid #333;
  letter-spacing: 2px;
  text-transform: uppercase;
  box-shadow: inset 0 0 8px rgba(255,204,0,0.15);
  opacity: 0;
  transform: translateX(-10px);
  transition: all 0.3s ease;
}

.sidebar.open a {
  opacity: 1;
  transform: translateX(0);
}

.sidebar.open a:hover {
  background: #1a1a00;
  color: #fff3a0;
  box-shadow: 0 0 14px rgba(255,204,0,0.5);
  transform: translateX(5px);
}

.sidebar.open a.active {
  background: #ffcc00;
  color: #111;
  font-weight: bold;
  box-shadow: 0 0 18px rgba(255,204,0,0.8);
  transform: translateX(8px);
}

.sidebar::after {
  content: "";
  position: absolute;
  inset: 0;
  background-image: radial-gradient(rgba(255,204,0,0.18) 1px, transparent 1px);
  background-size: 6px 6px;
  pointer-events: none;
  opacity: 0.35;
}

.sidebar > * {
  position: relative;
  z-index: 2;
}

/* CLOSE BUTTON */
.close-btn {
  position: absolute;
  top: 15px;
  right: 15px;
  width: 40px;
  height: 40px;
  border-radius: 10px;
  background: rgba(255,255,255,0.1);
  backdrop-filter: blur(6px);
  border: none;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: 0.25s;
  box-shadow: 0 4px 15px rgba(0,0,0,0.2);
}

.close-btn:hover {
  background: rgba(255,255,255,0.25);
  transform: scale(1.1);
}

.close-btn span {
  position: absolute;
  width: 20px;
  height: 2px;
  background: white;
  border-radius: 2px;
}

.close-btn span:nth-child(1) {
  transform: rotate(45deg);
}

.close-btn span:nth-child(2) {
  transform: rotate(-45deg);
}

/* MENU BUTTON */
.menu-btn {
  position: fixed;
  top: 18px;
  left: 18px;
  z-index: 25;
  width: 44px;
  height: 44px;
  border-radius: 12px;
  background: rgba(255,255,255,0.2);
  backdrop-filter: blur(6px);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  border: none;
  transition: 0.25s;
  padding: 0;
}

.menu-btn:hover {
  transform: scale(1.1);
  background: rgba(255,255,255,0.35);
}

.bar {
  display: block;
  width: 22px;
  height: 2px;
  background: white;
  margin: 3px 0;
  transition: 0.3s;
}

.menu-btn.open .bar:nth-child(1) {
  transform: translateY(8px) rotate(45deg);
}

.menu-btn.open .bar:nth-child(2) {
  opacity: 0;
}

.menu-btn.open .bar:nth-child(3) {
  transform: translateY(-8px) rotate(-45deg);
}

/* HEADER */
header {
  background: #007bff;
  color: white;
  text-align: center;
  padding: 2em;
  position: relative;
}

/* DARK MODE SLIDER */
.switch {
  position: absolute;
  top: 15px;
  right: 15px;
  width: 62px;
  height: 34px;
}

.switch input {
  opacity: 0;
}

.slider {
  position: absolute;
  inset: 0;
  background: #ccc;
  border-radius: 999px;
  cursor: pointer;
  transition: 0.4s;
}

.slider::before {
  content: "☀️";
  position: absolute;
  height: 26px;
  width: 26px;
  left: 4px;
  bottom: 4px;
  background: white;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: 0.4s;
}

.switch input:checked + .slider {
  background: #111827;
}

.switch input:checked + .slider::before {
  transform: translateX(28px) rotate(360deg);
  content: "🌙";
}

/* MAIN */
main {
  max-width: 800px;
  margin: auto;
  padding: 1.5em;
}

.card {
  background: white;
  padding: 2em;
  border-radius: 16px;
  margin-bottom: 2em;
  text-align: center;
  box-shadow: 0 15px 35px rgba(0,0,0,0.08);
  transition: 0.3s;
}

.profile-circle {
  width: 90px;
  height: 90px;
  border-radius: 50%;
  background: linear-gradient(135deg, #007bff, #66aaff);
  margin: auto;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 2.5em;
  color: white;
  box-shadow: 0 10px 25px rgba(0,123,255,0.35);
}

h2 {
  color: #ff4500;
}

.links {
  display: grid;
  gap: 1em;
}

.link-card {
  background: white;
  color: inherit;
  text-decoration: none;
  padding: 1.2em;
  border-radius: 14px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-left: 6px solid #007bff;
  box-shadow: 0 10px 25px rgba(0,0,0,0.08);
  transition: 0.25s;
}

.link-card:hover {
  transform: translateY(-5px) scale(1.02);
  outline: 3px solid #007bff;
  box-shadow: 0 18px 40px rgba(0,0,0,0.2);
}

.link-title {
  font-weight: bold;
  font-size: 1.1em;
}

.link-subtitle {
  font-size: 0.9em;
  opacity: 0.75;
}

.arrow {
  font-size: 1.5em;
  color: #007bff;
}

footer {
  text-align: center;
  padding: 1em;
  background: #222;
  color: white;
}

/* MOBILE */
@media (max-width: 700px) {
  header {
    padding-top: 4em;
  }

  .link-card {
    flex-direction: column;
    align-items: flex-start;
    gap: 0.5em;
  }
}
</style>
</head>

<body>

<img id="pageTrainTransition" src="train.PNG" alt="Train">
  
<div id="overlay"></div>

<nav id="sidebar" class="sidebar">
  <button id="closeSidebar" class="close-btn">
    <span></span>
    <span></span>
  </button>

  <h2>Pages</h2>
  <a href="index.html" class="page-link">Home</a>
<a href="links.html" class="active">Links</a>
</nav>

<button id="openSidebar" class="menu-btn">
  <span class="bar"></span>
  <span class="bar"></span>
  <span class="bar"></span>
</button>

<header>
  <h1>David's Links</h1>

  <label class="switch">
    <input type="checkbox" id="darkModeToggle">
    <span class="slider"></span>
  </label>
</header>

<main>

<section class="card">
  <div class="profile-circle">🚆</div>
  <h2>My Accounts</h2>
  <p>Here are my main links and profiles.</p>
</section>

<section class="links">

  <a class="link-card" href="https://github.com/trainguy1" target="_blank">
    <div>
      <div class="link-title">GitHub</div>
      <div class="link-subtitle">My code and projects</div>
    </div>
    <div class="arrow">→</div>
  </a>

  <a class="link-card" href="https://www.youtube.com/@CrackedPolishedBlackstone" target="_blank">
    <div>
      <div class="link-title">YouTube</div>
      <div class="link-subtitle">Videos and train content</div>
    </div>
    <div class="arrow">→</div>
  </a>

  <a class="link-card" href="https://sketchfab.com/betasaur" target="_blank">
    <div>
      <div class="link-title">Sketchfab</div>
      <div class="link-subtitle">Train and Tech 3D prints</div>
    </div>
    <div class="arrow">→</div>
  </a>

</section>

</main>

<footer>
  <p>© 2026 David</p>
</footer>

<script>
const toggle = document.getElementById("darkModeToggle");
const sidebar = document.getElementById("sidebar");
const menuBtn = document.getElementById("openSidebar");
const overlay = document.getElementById("overlay");
const closeSidebar = document.getElementById("closeSidebar");

if (localStorage.getItem("darkMode") === "on") {
  document.body.classList.add("dark-mode");
  toggle.checked = true;
}

toggle.addEventListener("change", () => {
  document.body.classList.toggle("dark-mode");

  localStorage.setItem(
    "darkMode",
    document.body.classList.contains("dark-mode") ? "on" : "off"
  );
});

menuBtn.onclick = () => {
  sidebar.classList.toggle("open");
  menuBtn.classList.toggle("open");
  overlay.classList.toggle("active");
};

closeSidebar.onclick = () => {
  sidebar.classList.remove("open");
  menuBtn.classList.remove("open");
  overlay.classList.remove("active");
};

overlay.onclick = () => {
  sidebar.classList.remove("open");
  menuBtn.classList.remove("open");
  overlay.classList.remove("active");
};

const trainTransition = document.getElementById("pageTrainTransition");
const pageLinks = document.querySelectorAll(".page-link");

pageLinks.forEach(link => {
  link.addEventListener("click", function(event) {
    event.preventDefault();

    const targetPage = this.href;

    trainTransition.classList.add("active");

    setTimeout(() => {
      window.location.href = targetPage;
    }, 1000);
  });
});
</script>

</body>
</html>
